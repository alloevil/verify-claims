name: index

# Regenerates docs/index.md from every guarded repository's own claims file.
#
# It runs on a schedule rather than on push, because the page depends on 22 other repositories:
# a push-triggered job would either be stale on arrival or rewrite itself constantly. Nothing here
# is a gate — the gates live in each repository — so a failure to reach one of them is reported in
# the page as `unreachable`, not as a red build.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Render the portfolio page
        run: python3 -m verify_claims --root . index --out docs/index.md
        env:
          PYTHONPATH: .
      - name: Commit the page if it moved
        run: |
          if git diff --quiet -- docs/index.md; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.md
          git commit -m "chore(index): regenerate the portfolio page"
          git push
